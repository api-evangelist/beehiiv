apiEntitlements:
- plan: Launch
  api: API access excluding the Send API
  mcp: beehiiv MCP (Read Access)
  webhooks: false
- plan: Scale
  api: API access excluding the Send API
  mcp: beehiiv MCP (Write Access)
  webhooks: true
- plan: Max
  api: Full API including the Send API
  mcp: beehiiv MCP (Write Access)
  webhooks: true
- plan: Enterprise
  api: Full API + SSO, dedicated IPs, custom publication limits
  mcp: beehiiv MCP (Write Access)
  webhooks: true
agentNote: beehiiv publishes a Marketing MCP at https://www.beehiiv.com/api/mcp with get_pricing and pricing_faq
  tools, and directs agents to call it rather than scrape the price slider. That makes plan data a first-class agent
  surface here — see mcp/beehiiv-mcp.yml.
