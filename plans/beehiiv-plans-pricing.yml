provenanceNote: Upgraded generated -> searched on 2026-08-13 against https://www.beehiiv.com/pricing.md (HTTP 200),
  a provider-published machine-readable twin of the pricing page carrying the full published price table by subscriber
  bucket. The prior entries quoted the 1,000-subscriber annual-equivalent figures ($43 Scale, $96 Max) as if they
  were the plan price; beehiiv prices Scale and Max per subscriber bucket, so a single monthly_price is not a faithful
  representation. The bucket table is now recorded in priceTable below and the headline entries carry the entry-point
  price.
