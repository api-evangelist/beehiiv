name: beehiiv
kind: company
description: beehiiv is a newsletter publishing platform offering email publishing, subscriber management, paid subscriptions,
  an ad network, referrals, polls, automations, segments, webhooks, and analytics for creators and media companies. Founded
  in 2021 by former Morning Brew operators and headquartered in New York City.
