description: FOCUS-aligned FinOps mapping for beehiiv. Billing model is primarily flat-rate subscription (Launch, Scale, Max) with custom Enterprise contracts; pricing is gated by subscriber count, not API usage, and email sends are unlimited on all paid tiers.
