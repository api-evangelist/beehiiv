meters:
- name: subscriber_count
  description: Active subscriber count is the gating metric for tier upgrades (2,500 free; 100,000 paid; custom Enterprise).
  unit: subscribers
  aggregation: max
  dimensions:
  - publication
  - organization
- name: publication_count
  description: Number of publications within a workspace; up to 10 on Max, custom on Enterprise.
  unit: publications
  aggregation: count
  dimensions:
  - organization
- name: team_seats
  description: Number of team seats; 3 on Scale, unlimited on Max and Enterprise.
  unit: seats
  aggregation: count
  dimensions:
  - organization
principles:
- name: Visibility
  description: Beehiiv invoices flat-rate subscription line items. Tag invoices with the publication ID and engineering owner in your FinOps store.
- name: Allocation
  description: Allocate by publication or business unit. With unlimited email sends, allocation is per-publication rather than per-send.
- name: Optimization
  description: Choose annual billing for ~12-14% savings vs. monthly. Right-size on tier by reviewing the subscriber count vs. plan ceiling before renewal. Stay below 2,500 subs to remain on Launch.
- name: Accountability
  description: Assign a contract owner per publication; review subscriber growth against tier ceilings monthly to anticipate upgrade timing.
