serviceCategory: Newsletter Publishing
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Adjustment
  notes: Flat-rate monthly/annual subscription based on subscriber tier. No metered API usage charges (rate limit at 180 req/min per org). Enterprise contracts negotiated separately.
focusColumns:
  ServiceName: beehiiv
  ServiceCategory: Newsletter Publishing
