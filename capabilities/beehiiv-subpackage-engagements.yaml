      operations:
      - method: GET
        name: index
        description: 'Get publication engagements <Badge intent="info" minimal outlined>OAuth Scope: publications:read</Badge>'
        call: beehiiv-subpackage-engagements.index
        with:
          publicationId: rest.publicationId
          start_date: rest.start_date
          number_of_days: rest.number_of_days
          granularity: rest.granularity
          email_type: rest.email_type
          direction: rest.direction
          Authorization: rest.Authorization
        outputParameters:
        - type: object
