      x-artifact: errors/beehiiv-problem-types.yml
- target: $.info
  update:
    x-idempotency:
      supported: false
      note: No Idempotency-Key. Retrying a create can duplicate; dedupe client-side.
      x-artifact: conventions/beehiiv-conventions.yml
