          description: An optional list of condition set UUIDs to gate this block behind dynamic content targeting. When provided, only subscribers matching the specified condition sets will see this block. Condition sets must belong to the same publication and be active.
        condition_set_operator:
          $ref: '#/components/schemas/type_posts_ConditionSetOperator'
          description: Instructs how to combine multiple condition sets. Defaults to "or" (subscriber can match any condition). Use "and" to show the block if the subscriber meets all conditions.
      title: VisibilitySettings
    type_posts_ListType:
      type: string
      enum:
      - ordered
      - unordered
      description: The type of list (e.g., ordered, unordered).
      title: ListType
    type_posts_TableCellData:
      type: object
      properties:
        text:
          type: string
          description: The text content of the cell.
        formattedText:
          type: array
          items:
            $ref: '#/components/schemas/type_posts_ParagraphBlockTextSection'
          description: The formatted content of the cell.
        alignment:
          $ref: '#/components/schemas/type_posts_TextAlignment'
          description: The text alignment of the cell.
        colspan:
          type: integer
          default: 1
          description: The number of columns the cell spans.
        rowspan:
          type: integer
          default: 1
          description: The number of rows the cell spans.
      title: TableCellData
    type__PostWebRecipientsResponse:
      type: object
      properties:
        tier_ids:
          type: array
          items:
            type: string
          description: The tier IDs targeted for web. Values are `"free"`, `"premium"`, or a specific tier's prefixed ID.
        include_segment_ids:
          type: array
          items:
            $ref: '#/components/schemas/type_ids_SegmentId'
        exclude_segment_ids:
          type: array
          items:
            $ref: '#/components/schemas/type_ids_SegmentId'
      title: PostWebRecipientsResponse
    type__PostProcessingData:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/type_ids_PostId'
          description: The prefixed post id. Stable — this is the id the post will have once created.
        state:
          $ref: '#/components/schemas/type__PostProcessingState'
          description: The background creation state of the post.
      required:
      - id
      - state
      title: PostProcessingData
  securitySchemes:
    BearerAuthScheme:
      type: http
      scheme: bearer
